<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formResumenTramite" title=" ">
                <ace:panel id="resumenTramitesPanel" header="#{msg.reporteResumenTramites}" >
                    <table border="0" cellspacing="5" class="panel-message" cellpadding="5" >
                        <tr >
                            <td colspan="2" >
                                <h:outputLabel value="Se tienen en cuenta los trámites iniciados y/o cerrados en el periodo ingresado." class="msg-info" />
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value= "(*) #{msg.fechaDesde}:" />
                            </td>
                            <td align="left">
                                <ace:dateTimeEntry id="fechaDesde"
                                                   value="#{resumenTramiteManagedBean.fechaDesde}"
                                                   timeZone="America/Buenos_Aires"
                                                   pattern="dd/MM/yyyy"
                                                   requiredMessage="Se necesita un valor para la fecha desde."
                                                   required="true"
                                                   effect="fadeIn"
                                                   renderAsPopup="true" >
                                    <ace:ajax execute="@this" render="@all" />
                                </ace:dateTimeEntry>
                            </td>
                            <td align="left">
                                <ace:message id="fechaDesdeMsg" for="fechaDesde" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.fechaHasta}:" />
                            </td>
                            <td align="left">
                                <ace:dateTimeEntry id="fechaHasta"
                                                   value="#{resumenTramiteManagedBean.fechaHasta}"
                                                   timeZone="America/Buenos_Aires"
                                                   pattern="dd/MM/yyyy"
                                                   effect="fadeIn"
                                                   required="true"
                                                   requiredMessage="Se necesita un valor para la fecha hasta."
                                                   renderAsPopup="true" >
                                    <ace:ajax execute="@this" render="@all"  />
                                </ace:dateTimeEntry>
                            </td>
                            <td align="left">
                                <ace:message id="fechaHastaMsg" for="fechaHasta" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        <tr>
                            <td align="right"></td>
                            <td align="left">
                                <h:panelGrid id="buttonGrid" columns="3" >
                                    <ace:pushButton id="generarReporte" action="#{resumenTramiteManagedBean.generarReporte()}">
                                        <i class="fa fa-file-text" ></i>
                                        #{msg.generarReporte}
                                    </ace:pushButton>
                                </h:panelGrid>
                            </td>
                        </tr>
                    </table>
                </ace:panel>     
                <ace:submitMonitor id="submitMonitorRendiciones"
                                   for="resumenTramitesPanel"
                                   blockUI="@all"
                                   autoCenter="true"
                                   activeLabel="#{msg.espere}"
                                   networkErrorLabel="#{msg.errorConexion}"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
